<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>seeknull</title>
<meta name="description" content="Projects by seek:null — main site at seeknull.com.">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 4rem 1.25rem;
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center;
    background: #f6f7f9; color: #14181f;
  }
  main { width: 100%; max-width: 34rem; }
  h1 { font-size: 1.6rem; margin: 0 0 .25rem; letter-spacing: -.01em; }
  .lede { margin: 0 0 2.5rem; color: #5b6472; }
  h2 {
    font-size: .78rem; text-transform: uppercase; letter-spacing: .09em;
    color: #5b6472; margin: 0 0 .9rem; font-weight: 600;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: .85rem 0; border-top: 1px solid #e2e5ea; }
  li:last-child { border-bottom: 1px solid #e2e5ea; }
  .name { font-weight: 600; text-decoration: none; color: #14181f; }
  .name:hover { text-decoration: underline; }
  .what { display: block; color: #5b6472; font-size: .93rem; margin-top: .15rem; }
  footer { margin-top: 3rem; font-size: .85rem; color: #78808d; }
  footer a { color: inherit; }
  @media (prefers-color-scheme: dark) {
    body { background: #14181f; color: #e8eaee; }
    .lede, h2, .what, footer { color: #98a1af; }
    li { border-color: #262c36; }
    .name { color: #e8eaee; }
  }
</style>
</head>
<body>
<main>
  <h1>seeknull</h1>
  <p class="lede">Things built to scratch an itch.</p>

  <h2>Projects</h2>
  <ul>
    <li>
      <a class="name" href="https://github.com/seeknull/otp-relay">OTP Relay</a>
      <span class="what">
        Android app that forwards one-time passcodes to one chosen contact, for a set time.
        No server, no SMS gateway.
      </span>
    </li>
  </ul>

  <footer>
    <a href="https://seeknull.com">seeknull.com</a> ·
    <a href="https://github.com/seeknull">github.com/seeknull</a>
  </footer>
</main>
</body>
</html>
